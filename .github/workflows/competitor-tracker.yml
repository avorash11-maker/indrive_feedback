name: Competitor Tracker
run-name: >-
  Competitor Tracker ·
  ${{ github.event_name == 'schedule' && 'scheduled prod' || (inputs.dry_run && 'manual dry-run' || 'manual delivery') }}

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run delivery in dry-run mode"
        required: false
        default: true
        type: boolean
      days:
        description: "Lookback window in days"
        required: false
        default: "7"
        type: string
      regions:
        description: "Comma-separated region keys, for example sea,latam"
        required: false
        default: ""
        type: string
      export_csv:
        description: "Export CSV review artifacts"
        required: false
        default: true
        type: boolean
      to_telegram:
        description: "Send digest to Telegram"
        required: false
        default: false
        type: boolean
      to_notion:
        description: "Sync final alerts to Notion"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: competitor-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  competitor-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      COMPETITOR_TRACKER_OUTPUT_DIR: output/competitor_tracker
      COMPETITOR_TRACKER_DB_PATH: output/competitor_tracker/tracker.db
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      COMPETITOR_TRACKER_NOTION_DATABASE_ID: ${{ secrets.COMPETITOR_TRACKER_NOTION_DATABASE_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run competitor tracker
        id: run_tracker
        shell: bash
        env:
          INPUT_DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          INPUT_DAYS: ${{ github.event_name == 'schedule' && '7' || inputs.days }}
          INPUT_REGIONS: ${{ github.event_name == 'schedule' && '' || inputs.regions }}
          INPUT_EXPORT_CSV: ${{ github.event_name == 'schedule' && 'true' || inputs.export_csv }}
          INPUT_TO_TELEGRAM: ${{ github.event_name == 'schedule' && 'true' || inputs.to_telegram }}
          INPUT_TO_NOTION: ${{ github.event_name == 'schedule' && 'auto' || inputs.to_notion }}
        run: |
          set -euo pipefail
          args=("run" "--days" "${INPUT_DAYS}")
          notion_mode="false"
          telegram_mode="false"

          if [[ ! "${INPUT_DAYS}" =~ ^[0-9]+$ ]] || [[ "${INPUT_DAYS}" -le 0 ]]; then
            echo "Input validation failed: days must be a positive integer, got '${INPUT_DAYS}'." >&2
            exit 1
          fi

          if [[ "${INPUT_EXPORT_CSV}" == "true" ]]; then
            args+=("--export-csv")
          fi

          if [[ -n "${INPUT_REGIONS}" ]]; then
            IFS=',' read -ra regions <<< "${INPUT_REGIONS}"
            for region in "${regions[@]}"; do
              trimmed="$(echo "${region}" | xargs)"
              if [[ -n "${trimmed}" ]]; then
                args+=("--region" "${trimmed}")
              fi
            done
          fi

          if [[ "${INPUT_TO_NOTION}" == "auto" ]]; then
            if [[ -n "${NOTION_TOKEN}" && -n "${COMPETITOR_TRACKER_NOTION_DATABASE_ID}" ]]; then
              notion_mode="true"
            else
              notion_mode="false"
              echo "Notion sync is disabled for this scheduled run because required Notion secrets are missing."
            fi
          else
            notion_mode="${INPUT_TO_NOTION}"
          fi

          if [[ "${INPUT_TO_TELEGRAM}" == "true" && "${INPUT_DRY_RUN}" != "true" ]]; then
            telegram_mode="send"
            python -m competitor_tracker preflight --mode github-actions-production
          elif [[ "${INPUT_TO_TELEGRAM}" == "true" && "${INPUT_DRY_RUN}" == "true" ]]; then
            telegram_mode="dry-run"
          else
            telegram_mode="off"
          fi

          if [[ "${notion_mode}" == "true" && "${INPUT_DRY_RUN}" != "true" ]]; then
            python -m competitor_tracker preflight --mode notion-sync
          fi

          if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
            if [[ "${INPUT_TO_TELEGRAM}" == "true" ]]; then
              args+=("--telegram-dry-run")
            fi
            if [[ "${notion_mode}" == "true" ]]; then
              args+=("--notion-dry-run")
            fi
          else
            if [[ "${INPUT_TO_TELEGRAM}" == "true" ]]; then
              args+=("--to-telegram")
            fi
            if [[ "${notion_mode}" == "true" ]]; then
              args+=("--to-notion")
            fi
          fi

          echo "Running competitor tracker with delivery settings: dry_run=${INPUT_DRY_RUN}, to_telegram=${INPUT_TO_TELEGRAM}, to_notion=${notion_mode}"
          python -m competitor_tracker "${args[@]}"

          echo "input_dry_run=${INPUT_DRY_RUN}" >> "${GITHUB_OUTPUT}"
          echo "input_days=${INPUT_DAYS}" >> "${GITHUB_OUTPUT}"
          echo "input_regions=${INPUT_REGIONS}" >> "${GITHUB_OUTPUT}"
          echo "telegram_mode=${telegram_mode}" >> "${GITHUB_OUTPUT}"
          echo "notion_mode=${notion_mode}" >> "${GITHUB_OUTPUT}"

      - name: Publish run summary
        if: always()
        shell: bash
        env:
          RUN_DRY_RUN: ${{ steps.run_tracker.outputs.input_dry_run }}
          RUN_DAYS: ${{ steps.run_tracker.outputs.input_days }}
          RUN_REGIONS: ${{ steps.run_tracker.outputs.input_regions }}
          RUN_TELEGRAM_MODE: ${{ steps.run_tracker.outputs.telegram_mode }}
          RUN_NOTION_MODE: ${{ steps.run_tracker.outputs.notion_mode }}
        run: |
          set -euo pipefail
          {
            echo "## Competitor Tracker Run"
            echo
            echo "- Event: ${GITHUB_EVENT_NAME}"
            echo "- Dry run: ${RUN_DRY_RUN:-unknown}"
            echo "- Lookback days: ${RUN_DAYS:-unknown}"
            echo "- Regions: ${RUN_REGIONS:-all configured regions}"
            echo "- Telegram mode: ${RUN_TELEGRAM_MODE:-unknown}"
            echo "- Notion mode: ${RUN_NOTION_MODE:-unknown}"
            echo "- Output dir: ${COMPETITOR_TRACKER_OUTPUT_DIR}"
            if [[ -f "${COMPETITOR_TRACKER_OUTPUT_DIR}/run_summary.json" ]]; then
              python - <<'PY'
import json
from pathlib import Path

summary_path = Path("output/competitor_tracker/run_summary.json")
payload = json.loads(summary_path.read_text(encoding="utf-8"))
print("- Run status: {}".format(payload.get("status", "unknown")))
print("- Queries generated: {}".format(payload.get("queries_generated", 0)))
print("- Raw articles fetched: {}".format(payload.get("raw_articles_fetched", 0)))
print("- Raw articles deduplicated: {}".format(payload.get("raw_articles_deduplicated", 0)))
print("- Candidates kept: {}".format(payload.get("candidates_kept", 0)))
print("- Alerts created: {}".format(payload.get("alerts_created", 0)))
print("- Alerts sent: {}".format(payload.get("alerts_sent", 0)))
provider_errors = payload.get("provider_errors") or {}
print("- Provider errors: {}".format(len(provider_errors)))
if provider_errors:
    print("- Provider error keys: {}".format(", ".join(sorted(provider_errors.keys()))))
PY
            else
              echo "- Run summary: not generated"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload competitor tracker artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-tracker-artifacts-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            output/competitor_tracker/
          if-no-files-found: warn
          retention-days: 14
