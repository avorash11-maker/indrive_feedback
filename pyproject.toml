[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indrive-media-intelligence"
version = "0.1.0"
description = "AI-powered media monitoring system for inDrive mentions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["media-monitoring", "ai", "news-analysis", "indrive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.33.1",
    "beautifulsoup4>=4.14.3",
    "htmldate>=1.9.3",
    "openai>=1.0.0",
    "python-dotenv>=1.2.2",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
indrive-media = "indrive_media.main:main"
competitor-tracker = "competitor_tracker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["indrive_media*", "competitor_tracker*"]

[tool.setuptools.package-data]
competitor_tracker = ["default_config.json"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
